<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gurbani / Sikhi Agent — architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14213D;
    --node: #1B2C4D;
    --node-border: #3A4E77;
    --paper: #F3EEE3;
    --slate: #A9B6CC;
    --saffron: #E8973A;
    --amber: #D97A3F;
    --amber-bg: #2E2216;
    --tool: #2B7A6B;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; background: var(--bg); font-family:'Work Sans', sans-serif; }
  body { padding: 2.5rem 1rem 4rem; }
  h1 { font-family:'Fraunces', serif; font-weight:600; color:var(--paper);
       text-align:center; font-size: clamp(1.4rem, 3vw, 1.9rem); margin: 0 0 2rem; }
  .wrap { max-width: 1500px; margin: 0 auto; }
  svg text { font-family: 'Work Sans', sans-serif; fill: var(--paper); }
  svg .title { font-family: 'Fraunces', serif; font-weight: 600; }
  svg .sub { fill: var(--slate); font-size: 15px; }
  svg .callout-title { fill: var(--saffron); font-weight: 600; font-size: 15px; }
  svg .callout-body { fill: var(--slate); font-size: 14.5px; }
</style>
</head>
<body>
<div class="wrap">
<h1>Gurbani / Sikhi Agent — orchestrator + scoped retrieval tools</h1>
<svg viewBox="0 0 1700 1000" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7FA6"/>
    </marker>
  </defs>

  <!-- Orchestrator -->
  <rect x="520" y="40" width="480" height="100" rx="14" fill="var(--node)" stroke="var(--saffron)" stroke-width="2"/>
  <text x="760" y="80" text-anchor="middle" class="title" font-size="22">Gurbani / Sikhi Agent</text>
  <text x="760" y="106" text-anchor="middle" class="sub">[uber agent — the one reasoning loop]</text>

  <!-- Orchestrator role callout -->
  <rect x="1060" y="40" width="500" height="100" rx="10" fill="none" stroke="var(--node-border)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1080" y="65" class="callout-title">role of the orchestrator</text>
  <text x="1080" y="88" class="callout-body">Classifies intent · routes to the right tool(s) ·</text>
  <text x="1080" y="108" class="callout-body">holds session state across turns</text>

  <!-- Connector lines orchestrator -> nodes -->
  <path d="M700,140 L200,270" stroke="#6B7FA6" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M740,140 L560,270" stroke="#6B7FA6" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M800,140 L940,270" stroke="#6B7FA6" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M840,140 L1240,270" stroke="#6B7FA6" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- Node: History -->
  <rect x="60" y="270" width="280" height="92" rx="12" fill="var(--node)" stroke="var(--tool)" stroke-width="2"/>
  <text x="200" y="308" text-anchor="middle" class="title" font-size="18">History</text>
  <text x="200" y="332" text-anchor="middle" class="sub">tool — curated corpus</text>

  <!-- Node: Gurbani Search -->
  <rect x="400" y="270" width="320" height="92" rx="12" fill="var(--node)" stroke="var(--tool)" stroke-width="2"/>
  <text x="560" y="308" text-anchor="middle" class="title" font-size="18">Gurbani Search</text>
  <text x="560" y="332" text-anchor="middle" class="sub">tool — one index across all banis</text>

  <!-- Node: Saakhi's -->
  <rect x="800" y="270" width="280" height="92" rx="12" fill="var(--node)" stroke="var(--tool)" stroke-width="2"/>
  <text x="940" y="308" text-anchor="middle" class="title" font-size="18">Saakhi's</text>
  <text x="940" y="332" text-anchor="middle" class="sub">tool — narrative/story corpus</text>

  <!-- Node: Current Affairs -->
  <rect x="1120" y="270" width="300" height="92" rx="12" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1270" y="308" text-anchor="middle" class="title" font-size="18">Current Affairs</text>
  <text x="1270" y="332" text-anchor="middle" class="sub">agent — live data, different tier</text>

  <!-- Callout under Gurbani Search -->
  <rect x="400" y="400" width="320" height="160" rx="10" fill="none" stroke="var(--node-border)" stroke-width="1.5"/>
  <text x="418" y="426" class="callout-title">one corpus, not three agents</text>
  <text x="418" y="450" class="callout-body">A question spanning Jap +</text>
  <text x="418" y="470" class="callout-body">Sukhmani is two matches in the</text>
  <text x="418" y="490" class="callout-body">same search — not a routing call.</text>
  <text x="418" y="518" class="callout-body">Metadata: bani · ang · raag · author</text>

  <!-- Callout under Current Affairs -->
  <rect x="1120" y="400" width="300" height="160" rx="10" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="1.5"/>
  <text x="1138" y="426" class="callout-title" fill="var(--amber)">different trust tier</text>
  <text x="1138" y="450" class="callout-body">Can't be grounded in a fixed,</text>
  <text x="1138" y="470" class="callout-body">vetted corpus like the rest.</text>
  <text x="1138" y="498" class="callout-body">Needs live retrieval + its own</text>
  <text x="1138" y="518" class="callout-body">moderation layer — hold for later.</text>

  <!-- Connectors nodes -> MCP bar -->
  <path d="M200,362 L200,610" stroke="#6B7FA6" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M560,362 L560,610" stroke="#6B7FA6" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M940,362 L940,610" stroke="#6B7FA6" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1270,362 L1270,610" stroke="#6B7FA6" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- MCP layer bar -->
  <rect x="60" y="610" width="1360" height="90" rx="14" fill="var(--node)" stroke="var(--saffron)" stroke-width="2"/>
  <text x="740" y="646" text-anchor="middle" class="title" font-size="19">MCP layer</text>
  <text x="740" y="670" text-anchor="middle" class="sub">publish these as MCP tools — pluggable into any MCP host (Claude Desktop, your own portal, etc.)</text>

  <!-- Legend box: tool vs agent -->
  <rect x="60" y="740" width="660" height="220" rx="12" fill="var(--node)" stroke="var(--node-border)" stroke-width="1.5"/>
  <text x="82" y="772" class="callout-title" font-size="17">tool vs. agent</text>
  <text x="82" y="800" class="callout-body" fill="var(--paper)">Tool — deterministic retrieval, grounded in a</text>
  <text x="82" y="820" class="callout-body" fill="var(--paper)">fixed corpus, returns citations, no</text>
  <text x="82" y="840" class="callout-body" fill="var(--paper)">independent reasoning of its own.</text>
  <text x="82" y="868" class="callout-body" fill="var(--paper)">Agent — multi-step reasoning, can call several</text>
  <text x="82" y="888" class="callout-body" fill="var(--paper)">tools, holds state. Reserved for the</text>
  <text x="82" y="908" class="callout-body" fill="var(--paper)">orchestrator (and maybe current affairs, later).</text>

  <!-- Legend box: why this shape -->
  <rect x="760" y="740" width="660" height="220" rx="12" fill="var(--node)" stroke="var(--node-border)" stroke-width="1.5"/>
  <text x="782" y="772" class="callout-title" font-size="17">why this shape</text>
  <text x="782" y="800" class="callout-body" fill="var(--paper)">Trust lives in retrieval, not generation — the</text>
  <text x="782" y="820" class="callout-body" fill="var(--paper)">model's job is to find and cite the right</text>
  <text x="782" y="840" class="callout-body" fill="var(--paper)">passage, not to author an answer from memory.</text>
  <text x="782" y="868" class="callout-body" fill="var(--paper)">Keeping branches as tools, not agents, is what</text>
  <text x="782" y="888" class="callout-body" fill="var(--paper)">makes "we control what and how AI answers"</text>
  <text x="782" y="908" class="callout-body" fill="var(--paper)">actually true, not just a slogan.</text>
</svg>
</div>
</body>
</html>
